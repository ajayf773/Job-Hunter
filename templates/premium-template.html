<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Resume</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }
  html, body {
    width: 210mm;
    height: 297mm;
    margin: 0 auto;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    font-size: 10pt;
    line-height: 1.5;
    background-color: #ffffff;
    color: #1a1a1a;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
    overflow: hidden;
  }
  .resume-page {
    padding: 18mm 20mm;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
  }
  
  /* HEADER */
  header {
    text-align: center;
    margin-bottom: 6mm;
  }
  .name {
    font-size: 24pt;
    font-weight: 700;
    letter-spacing: 0.5px;
    color: #111827;
    margin-bottom: 2px;
    text-transform: uppercase;
  }
  .title {
    font-size: 12pt;
    font-weight: 500;
    color: #4F46E5; /* Indigo accent */
    margin-bottom: 3mm;
  }
  .contact-info {
    font-size: 8.5pt;
    color: #4b5563;
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
  }
  .contact-info span {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .contact-info svg {
    width: 12px;
    height: 12px;
    fill: #9ca3af;
  }

  /* SECTIONS */
  section {
    margin-bottom: 5mm;
  }
  .section-title {
    font-size: 11pt;
    font-weight: 600;
    color: #111827;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    border-bottom: 1px solid #e5e7eb;
    padding-bottom: 3px;
    margin-bottom: 4mm;
  }

  /* SUMMARY */
  .summary {
    font-size: 9.5pt;
    color: #374151;
    text-align: justify;
    line-height: 1.6;
  }

  /* EXPERIENCE & PROJECTS */
  .item {
    margin-bottom: 4mm;
  }
  .item-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 2px;
  }
  .item-title {
    font-weight: 600;
    font-size: 10pt;
    color: #111827;
  }
  .item-subtitle {
    font-weight: 500;
    font-size: 9.5pt;
    color: #4b5563;
    font-style: italic;
  }
  .item-date {
    font-size: 9pt;
    color: #6b7280;
    font-weight: 500;
  }
  .item-bullets {
    list-style-type: none;
    padding-left: 0;
    margin-top: 2px;
  }
  .item-bullets li {
    font-size: 9pt;
    color: #374151;
    margin-bottom: 3px;
    padding-left: 14px;
    position: relative;
    line-height: 1.5;
  }
  .item-bullets li::before {
    content: "•";
    position: absolute;
    left: 0;
    color: #4F46E5; /* Indigo accent bullet */
    font-weight: bold;
  }

  /* SKILLS */
  .skills-grid {
    display: grid;
    grid-template-columns: 140px 1fr;
    gap: 6px 12px;
    font-size: 9pt;
    line-height: 1.5;
  }
  .skill-category {
    font-weight: 600;
    color: #111827;
  }
  .skill-list {
    color: #374151;
  }

  /* EDUCATION */
  .education-row {
    display: flex;
    justify-content: space-between;
    font-size: 9.5pt;
  }
  .edu-degree {
    font-weight: 600;
    color: #111827;
  }
  .edu-school {
    color: #4b5563;
  }
</style>
</head>
<body>
  <div class="resume-page">
    <header>
      <div class="name" id="doc-name">{{NAME}}</div>
      <div class="title" id="doc-title">{{TITLE}}</div>
      <div class="contact-info">

      </div>
    </header>

    <section>
      <div class="section-title">Professional Summary</div>
      <div class="summary" id="doc-summary">{{SUMMARY}}</div>
    </section>

    <section>
      <div class="section-title">Experience</div>
      <div id="doc-experience">{{EXPERIENCE_HTML}}</div>
    </section>

    <section>
      <div class="section-title">Projects</div>
      <div id="doc-projects">{{PROJECTS_HTML}}</div>
    </section>

    <section>
      <div class="section-title">Skills</div>
      <div class="skills-grid" id="doc-skills">
        {{SKILLS_HTML}}
      </div>
    </section>

    <section>
      <div class="section-title">Education</div>
      <div class="education-row">
        <div><span class="edu-degree">B.Tech - Mechanical Engineering</span> <span class="edu-school">| VIT University, Vellore</span></div>
        <div class="item-date">Graduated 2020</div>
      </div>
    </section>
  </div>
</body>
</html>
